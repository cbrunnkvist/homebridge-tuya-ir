name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v1.2.1). If empty, uses the push tag."
        required: false
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          TAG_INPUT="${{ inputs.tag }}"
          if [ -n "$TAG_INPUT" ]; then
            echo "tag=$TAG_INPUT" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Verify tag matches package version
        run: |
          node -e "const pkg=require('./package.json'); const tag='${{ steps.tag.outputs.tag }}'; const expected='v'+pkg.version; if(tag!==expected){ console.error('Tag '+tag+' does not match package.json version '+pkg.version+' (expected '+expected+')'); process.exit(1); }"

      - name: Validate CHANGELOG entry
        id: changelog
        run: |
          VERSION="${{ steps.tag.outputs.tag }}"
          VERSION_NUM="${VERSION#v}"
          if ! grep -q "^## \[${VERSION_NUM}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for ${VERSION_NUM}. Add a ## [${VERSION_NUM}] section before publishing."
            exit 1
          fi
          # Extract the changelog entry for this version (from its heading to the next ## or end of file)
          RELEASE_BODY=$(sed -n "/^## \[${VERSION_NUM}\]/,/^## \[/p" CHANGELOG.md | sed '$ d')
          # Write to file for the release step
          echo "$RELEASE_BODY" > /tmp/release-body.md
          echo "version=${VERSION_NUM}" >> "$GITHUB_OUTPUT"

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Publish
        id: publish
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@cbrunnkvist/homebridge-tuya-ir@${VERSION}" version 2>/dev/null; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "@cbrunnkvist/homebridge-tuya-ir@${VERSION} already published — skipping."
          else
            npm publish --provenance --access public
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body_path: /tmp/release-body.md
          generate_release_notes: false
